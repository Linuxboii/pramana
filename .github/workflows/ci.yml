name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: Rust — fmt, clippy, tests, KATs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Known-answer vectors are up to date
        run: |
          cargo run -q -p pramana-core --example gen_vectors > /tmp/v1.json
          diff -u test-vectors/v1.json /tmp/v1.json

  python:
    name: Python reference — cross-implementation check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install cryptography
      - run: python python/pramana_ref.py --check-vectors test-vectors/v1.json

  web:
    name: WASM wallet, web app and browser end-to-end test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build WASM
        run: sh scripts/build-wasm.sh
      - name: Build web app
        working-directory: web
        run: |
          npm ci
          npm run build
      - name: Start demo server
        run: |
          cargo build --release -p pramana-demo
          PRAMANA_ADDR=127.0.0.1:8080 ./target/release/pramana-demo &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
      - name: End-to-end browser test
        working-directory: web
        run: PRAMANA_BROWSER=$(which google-chrome) node e2e/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-screenshots
          path: web/e2e/screenshots

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: pramana:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          docker run -d --name pramana -p 8080:8080 pramana:ci
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:8080/api/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8080/api/config | grep -q example-shop.com
          curl -sf http://127.0.0.1:8080/ | grep -q '<div id="root">'
          docker exec pramana pramana-demo --healthcheck
